[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-world-model"
version = "0.1.0"
description = "Offline structured state predictor with pinned RWM source"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
inference = ["torch==2.8.0", "jsonschema==4.25.1"]
training = ["torch==2.8.0", "numpy==2.2.6"]
test = ["pytest==8.4.2", "jsonschema==4.25.1"]

[tool.setuptools.packages.find]
include = ["frc_world_model*"]

[tool.setuptools.package-data]
"frc_world_model.upstream" = ["LICENSE"]
"frc_world_model" = ["_contracts/world-state-v1/*.json", "_contracts/world-state-v1/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
